<!DOCTYPE html>
<html lang="en" class="scroll-smooth light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Square Infra | Invisible Luxury &amp; Engineering Excellence</title>
    <meta name="description" content="A modern engineering powerhouse delivering excellence in construction, land development, and infrastructure in the Telangana growth corridors." />
    
    <!-- Inline Early Theme Initialization (Zero Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skysquare_theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN with Full Luxury/Editorial Token Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--color-page-bg)',
              foreground: 'var(--color-page-fg)',
              surface: {
                DEFAULT: 'var(--color-surface)',
                warm: 'var(--color-surface-warm)',
                elevated: 'var(--color-surface-elevated)',
                muted: 'var(--color-surface-muted)',
              },
              muted: 'var(--color-text-muted)',
              accent: {
                DEFAULT: 'var(--color-accent)',
                hover: 'var(--color-accent-hover)',
                light: 'var(--color-accent-light)',
                subtle: 'var(--color-accent-subtle)',
              },
              'accent-foreground': 'var(--color-accent-fg)',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            letterSpacing: {
              'editorial-tight': '-0.02em',
              'editorial-normal': '0.05em',
              'editorial-wide': '0.2em',
              'editorial-widest': '0.25em',
              'editorial-super': '0.3em',
            },
            boxShadow: {
              'hero': '0 8px 32px rgba(0, 0, 0, 0.12)',
              'feature': '0 4px 24px rgba(0, 0, 0, 0.08)',
              'blog': '0 4px 20px rgba(0, 0, 0, 0.06)',
              'blog-hover': '0 8px 32px rgba(0, 0, 0, 0.12)',
              'card': '0 2px 8px rgba(0, 0, 0, 0.02)',
              'card-hover': '0 8px 24px rgba(0, 0, 0, 0.06)',
              'btn': '0 4px 16px rgba(0, 0, 0, 0.15)',
              'btn-hover': '0 8px 24px rgba(0, 0, 0, 0.25)',
              'inner-hairline': 'inset 0 0 0 1px rgba(0, 0, 0, 0.08)',
            },
            transitionTimingFunction: {
              'luxury': 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
              'editorial': 'cubic-bezier(0.19, 1, 0.22, 1)',
            },
            transitionDuration: {
              '1500': '1500ms',
              '2000': '2000ms',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(12px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              marquee: 'marquee 35s linear infinite',
              fadeIn: 'fadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards',
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-[#D4AF37] selection:text-white relative overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
